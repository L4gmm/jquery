<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1° Exemplo Jquery</title>
    <Script src="https://code.jquery.com/jquery-3.6.0.min.js"></Script>
</head>
<body>
    <h1 id="#titulo">Titulo antigo</h1>
    <button id="btn-mudar">Mudar Texto</button>

    <script>
        $(document).ready(function(){
            $("#btn-mudar").click(function(){
                $("#titulo").text("Textp alterado com Jquery!")
            })
        })
    </script>
</body>
</html>
